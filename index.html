<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Diary</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .entries {
            margin-top: 30px;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
        }

        .entries h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .entry {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #4CAF50;
        }

        .entry-date {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .entry-meal {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 4px;
        }

        .entry-food {
            color: #555;
            font-size: 14px;
            margin-top: 6px;
        }

        .entry-notes {
            color: #888;
            font-size: 13px;
            font-style: italic;
            margin-top: 6px;
        }

        .entry-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        .entry-delete:hover {
            background: #da190b;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Food Diary</h1>

        <div id="message"></div>

        <form id="foodForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="mealType">Meal Type</label>
                <select id="mealType" required>
                    <option value="">Select meal...</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Snack">Snack</option>
                </select>
            </div>

            <div class="form-group">
                <label for="foodItems">Food Items</label>
                <textarea id="foodItems" placeholder="e.g., 2 slices of bread, apple, water" required></textarea>
            </div>

            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" placeholder="Any notes about allergies, reactions, etc."></textarea>
            </div>

            <button type="submit">Add Entry</button>
        </form>

        <div class="entries">
            <h2>Recent Entries</h2>
            <div id="entriesList" class="loading">Loading entries...</div>
        </div>
    </div>

    <script>
        // CONFIGURE YOUR SUPABASE CREDENTIALS HERE
        const SUPABASE_URL = 'https://pbsugryqanetdeywqsjl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eANZaX060S7rDnJOXQEUmA_4DOfouQk';

        // Initialize Supabase
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        // Load entries on page load
        loadEntries();

        // Form submission
        document.getElementById('foodForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const date = document.getElementById('date').value;
            const mealType = document.getElementById('mealType').value;
            const foodItems = document.getElementById('foodItems').value;
            const notes = document.getElementById('notes').value;

            const button = e.target.querySelector('button');
            button.disabled = true;

            try {
                const { data, error } = await supabase
                    .from('food_entries')
                    .insert([
                        {
                            date,
                            meal_type: mealType,
                            food_items: foodItems,
                            notes: notes || null
                        }
                    ])
                    .select();

                if (error) throw error;

                showMessage('Entry added! ✓', 'success');
                document.getElementById('foodForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                loadEntries();
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                button.disabled = false;
            }
        });

        async function loadEntries() {
            try {
                const { data, error } = await supabase
                    .from('food_entries')
                    .select('*')
                    .order('date', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const entriesList = document.getElementById('entriesList');

                if (!data || data.length === 0) {
                    entriesList.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No entries yet</p>';
                    return;
                }

                entriesList.innerHTML = data.map(entry => `
                    <div class="entry">
                        <div class="entry-date">${new Date(entry.date).toLocaleDateString()}</div>
                        <div class="entry-meal">${entry.meal_type}</div>
                        <div class="entry-food">${entry.food_items}</div>
                        ${entry.notes ? `<div class="entry-notes">${entry.notes}</div>` : ''}
                        <button class="entry-delete" onclick="deleteEntry(${entry.id})">Delete</button>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('entriesList').innerHTML = `<div class="error">Error loading entries: ${error.message}</div>`;
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Delete this entry?')) return;

            try {
                const { error } = await supabase
                    .from('food_entries')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showMessage('Entry deleted', 'success');
                loadEntries();
            } catch (error) {
                showMessage('Error deleting: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
